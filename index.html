<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>Equipment Checklist System</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6efd">

<!-- External Libraries -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

<!-- Custom Styles (Extracted) -->
<link rel="stylesheet" href="style.css">
</head>
<body class="font-medium">

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay" style="display:none;">
  <div class="spinner-border text-primary" role="status"></div>
  <div class="mt-2" id="loadingMessage">កំពុងដំណើរការ...</div>
</div>

<!-- Settings Panel (Floating) -->
<div class="settings-panel" id="settingsPanel">
  <i class="bi bi-moon-stars settings-icon" id="darkModeToggle" title="Dark mode"></i>
  <div class="zoom-control">
    <i class="bi bi-zoom-out settings-icon" id="zoomOut"></i>
    <span id="zoomLevel">100%</span>
    <i class="bi bi-zoom-in settings-icon" id="zoomIn"></i>
  </div>
  <div class="font-control">
    <i class="bi bi-text-left settings-icon" id="fontDecrease"></i>
    <span id="fontSize">មធ្យម</span>
    <i class="bi bi-text-right settings-icon" id="fontIncrease"></i>
  </div>
</div>

<!-- ==========================================
     TOP HEADER: Hamburger, Notifications & Profile
     ========================================== -->
<div id="topHeader" class="top-header" style="display:none;">
  
  <!-- Left Side: Hamburger & Title -->
  <div class="d-flex align-items-center gap-2">
    <button class="hamburger-btn" onclick="toggleSideNav()"><i class="bi bi-list"></i></button>
    <span class="fw-bold" id="currentAppTitle" style="font-size: 15px;">Monthly Check</span>
  </div>
  
  <!-- Right Side: Notifications & Profile -->
  <div class="d-flex align-items-center gap-3">
    
    <!-- Notifications Bell -->
    <div style="position:relative; cursor:pointer;" onclick="openNotificationsModal()">
      <i class="bi bi-bell" style="font-size: 22px; color: var(--text-color);"></i>
      <span id="notifBadge" class="badge bg-danger" style="display:none; position:absolute; top:-5px; right:-5px; font-size:10px; border-radius:50%;">0</span>
    </div>
    
    <!-- User Profile -->
    <div class="user-profile" onclick="openAccountModal()">
      <i class="bi bi-person-circle" style="font-size: 28px; color: var(--tab-active); cursor: pointer;"></i>
    </div>

  </div>
</div>

<!-- ==========================================
     SIDE NAVIGATION (Vertical Tabs)
     ========================================== -->
<div id="sideNav" class="side-nav">
  <div class="side-nav-header">
    <h6 class="mb-0 fw-bold"><i class="bi bi-grid-1x2-fill text-primary me-2"></i>App Switcher</h6>
    <button class="btn-close" onclick="toggleSideNav()"></button>
  </div>
  <div class="side-nav-links">
    <button id="tabMonthly" class="side-nav-btn active" onclick="switchApp('monthly')">
      <i class="bi bi-calendar-check"></i> Monthly Check
    </button>
    <button id="tabDaily" class="side-nav-btn" onclick="switchApp('daily')">
      <i class="bi bi-calendar-day"></i> Daily Check
    </button>
  </div>
</div>
<div id="sideNavBackdrop" class="side-nav-backdrop" onclick="toggleSideNav()"></div>

<!-- ==========================================
     MAIN CONTENT WRAPPER
     ========================================== -->
<div class="main-wrapper" id="mainWrapper">
  <div id="app" style="display:none;"></div>
  <div class="bottom-nav" id="bottomNav" style="display:none;"></div>
</div>

<!-- Login Screen -->
<div id="loginContainer" class="login-container" style="display:none;">
  <div class="card p-4">
    <div class="text-center mb-3">
      <i class="bi bi-clipboard2-check" style="font-size:3rem;color:var(--tab-active);"></i>
      <h5 class="mt-2">Equipment Checklist</h5>
    </div>
    <form id="loginForm">
      <div class="mb-3"><label class="form-label">ឈ្មោះអ្នកប្រើ</label><input type="text" class="form-control" id="username" required></div>
      <div class="mb-3"><label class="form-label">ពាក្យសម្ងាត់</label><input type="password" class="form-control" id="password" required></div>
      <button type="submit" class="btn btn-primary w-100">ចូល</button>
    </form>
    <div id="loginError" class="text-danger mt-2 small"></div>
  </div>
</div>

<!-- ==========================================
     MODALS
     ========================================== -->
<!-- Detail Modal -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content" style="background:var(--card-bg);color:var(--text-color);">
      <div class="modal-header" style="border-bottom:1px solid var(--border-color);">
        <h6 class="modal-title"><i class="bi bi-info-circle-fill me-2 text-primary"></i>លម្អិត - <span id="modalTitle"></span></h6>
        <div class="ms-auto d-flex gap-1 me-2" id="modalActionButtons">
          <button class="btn btn-sm btn-outline-primary" onclick="printCurrentReport()" title="Print">
            <i class="bi bi-printer"></i><span class="d-none d-md-inline ms-1">Print</span>
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="saveCurrentReportImage()" title="Download image">
            <i class="bi bi-file-earmark-image"></i><span class="d-none d-md-inline ms-1">Image</span>
          </button>
          <button class="btn btn-sm btn-outline-dark" onclick="saveCurrentReportPDF()" title="Download PDF">
            <i class="bi bi-file-earmark-pdf"></i><span class="d-none d-md-inline ms-1">PDF</span>
          </button>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0" id="modalBody" style="background:var(--bg-color);"></div>
    </div>
  </div>
</div>

<!-- Remark Modal -->
<div class="modal fade" id="remarkModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content" style="background:var(--card-bg);color:var(--text-color);">
      <div class="modal-header" style="border-bottom:1px solid var(--border-color);">
        <h6 class="modal-title" id="remarkModalTitle"><i class="bi bi-chat-left-text me-2 text-primary"></i>Remark</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label small" id="remarkModalLabel">Remark (optional):</label>
        <textarea class="form-control form-control-sm" id="remarkModalInput" rows="3" placeholder="បញ្ជាក់..."></textarea>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border-color);">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" id="remarkModalOk">OK</button>
      </div>
    </div>
  </div>
</div>

<!-- Account Modal -->
<div class="modal fade" id="accountModal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content" style="background:var(--card-bg);color:var(--text-color);">
      <div class="modal-header border-0 pb-0">
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center pt-0 pb-4">
        <i class="bi bi-person-circle" style="font-size:4rem;color:var(--tab-active);"></i>
        <h5 class="mt-2 mb-0" id="accFullName"></h5>
        <div class="text-muted small" id="accUsername"></div>
        <span class="badge bg-primary mt-2 text-capitalize" id="accRole"></span>
        <div class="text-muted small mt-2" id="accGroup"></div>
        
        <hr class="my-3">
        
        <!-- 👇 ADD THIS BLOCK 👇 -->
        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
          <span class="small fw-bold"><i class="bi bi-bell-fill me-1"></i> Push Notifications</span>
          <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" id="pushToggle" onchange="togglePushSubscription(this.checked)">
          </div>
        </div>
        <!-- 👆 END ADD BLOCK 👆 -->
        
        
        <button class="btn btn-outline-primary w-100 mb-2" onclick="$('#settingsPanel').toggleClass('visible'); bootstrap.Modal.getInstance(document.getElementById('accountModal')).hide();">
          <i class="bi bi-gear me-1"></i>ការកំណត់
        </button>
        <button class="btn btn-outline-danger w-100" onclick="doLogout()">
          <i class="bi bi-box-arrow-right me-1"></i>ចាកចេញ
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ==========================================
     ASSIGN DIALOG (Monthly – Admin)
     ========================================== -->
<div class="modal fade" id="assignDialogModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--card-bg);color:var(--text-color);">
      <div class="modal-header" style="border-bottom:1px solid var(--border-color);">
        <h6 class="modal-title"><i class="bi bi-person-plus me-2 text-primary"></i>New Assignment</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label small fw-bold">Equipment *</label>
          <select class="form-select form-select-sm" id="assignEquipment"></select>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Trailer (optional)</label>
          <select class="form-select form-select-sm" id="assignTrailer"></select>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Driver *</label>
          <select class="form-select form-select-sm" id="assignDriver"></select>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Date *</label>
          <input type="date" class="form-control form-control-sm" id="assignDate">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Remark (optional)</label>
          <textarea class="form-control form-control-sm" id="assignRemark" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border-color);">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" onclick="submitAssignDialog()"><i class="bi bi-check-circle me-1"></i>Assign</button>
      </div>
    </div>
  </div>
</div>

<!-- ==========================================
     MANAGE DRIVERS (Daily – Admin)
     ========================================== -->
<div class="modal fade" id="manageDriversModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content" style="background:var(--card-bg);color:var(--text-color);">
      <div class="modal-header" style="border-bottom:1px solid var(--border-color);">
        <h6 class="modal-title"><i class="bi bi-people me-2 text-primary"></i>គ្រប់គ្រងអ្នកបើកបរ</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="manageDriversList"></div>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border-color);">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- External Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- API Polyfill (MUST load before app.js) -->
<script src="gas-api.js"></script>

<!-- App Logic (Extracted) -->
<script src="app.js"></script>

<!-- Project 2 Service Worker Registration -->
<script>
  // Only register if NOT inside Google Apps Script
  if (window.location.hostname.indexOf('google') === -1 && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw-project2.js', { scope: './' })
        .then(reg => console.log('Project 2 Service Worker registered!', reg))
        .catch(err => console.log('Project 2 Service Worker registration failed:', err));
    });
  }
</script>
</body>
</html>
